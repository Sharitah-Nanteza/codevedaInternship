<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanteza | Digital SPA Portal</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
</head>
<body>

    <div id="app">
        <header class="navbar">
            <div class="logo">NANTEZA</div>
            <nav>
                <div class="nav-links">
                    <router-link to="/">Home</router-link>
                    <router-link to="/about">About the Atelier</router-link>
                    <router-link to="/contact">Contact</router-link>
                </div>
            </nav>
        </header>

        <main class="view-container">
            <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                    <component :is="Component" />
                </transition>
            </router-view>
        </main>

        <footer class="spa-footer">
            <p>&copy; 2026 NANTEZA. Precision SPA Assignment Portfolio.</p>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
